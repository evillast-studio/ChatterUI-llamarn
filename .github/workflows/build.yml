name: ChatterUI Android Build

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - 'README.md'
      - '.github/ISSUE_TEMPLATE/*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # Desactiva el daemon de Gradle (innecesario en CI, consume RAM)
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.configureondemand=true
        -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
        -Dkotlin.incremental=false
      # Sin telemetría de Expo ni npm
      EXPO_NO_TELEMETRY: 1
      NPM_CONFIG_FUND: false
      NPM_CONFIG_AUDIT: false
      NPM_CONFIG_UPDATE_NOTIFIER: false
      # Sin logs de React Native innecesarios
      RCT_NO_LAUNCH_PACKAGER: 1

    steps:

      # ── 1. LIBERAR ESPACIO EN DISCO ─────────────────────────────────────────
      - name: Free disk space
        run: |
          echo "=== Espacio antes ==="
          df -h /

          # Eliminar herramientas pesadas que no se usan en este build
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/share/swift \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/build-tools \
            /usr/local/lib/android/sdk/platforms \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/go \
            /opt/az \
            /opt/google \
            /imagegeneration \
            /usr/local/share/powershell \
            /usr/local/share/chromium \
            /usr/share/php* \
            /usr/lib/jvm/temurin-* \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true

          # Limpiar apt sin romper dependencias necesarias
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== Espacio después ==="
          df -h /

      # ── 2. SWAP ─────────────────────────────────────────────────────────────
      # La compilación de llama.rn (C++/NDK) necesita mucha RAM
      # El runner ya puede tener un swapfile activo, usamos dd como fallback
      - name: Configure swap (8 GB)
        run: |
          # Desactivar y eliminar swap existente si lo hay
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile || true

          # Crear nuevo swapfile con dd (más compatible que fallocate en CI)
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          # Prioridad baja: usa swap solo cuando la RAM real se agota
          sudo sysctl vm.swappiness=10
          echo "Swap activo:"
          swapon --show

      # ── 3. HERRAMIENTAS DEL SISTEMA ─────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            ninja-build \
            cmake \
            ccache \
            unzip \
            curl

          # Java 17 como activo
          sudo update-alternatives --set java \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> $GITHUB_PATH

      # ── 4. ANDROID SDK / NDK ────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and build tools
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "cmake;3.22.1"

          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018"         >> $GITHUB_ENV

      # ── 5. NODE / npm ───────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── 6. CCACHE (caché de compilación C++) ────────────────────────────────
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ github.ref_name }}-
            ccache-android-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --zero-stats

      # ── 7. CHECKOUT ─────────────────────────────────────────────────────────
      - name: Checkout ChatterUI
        uses: actions/checkout@v4
        with:
          path: ChatterUI

      - name: Cache llama.rn-0.13.0-rc.6
        uses: actions/cache@v4
        id: llama-cache
        with:
          path: llama.rn-0.13.0-rc.6
          key: llama-rn-0.13.0-rc.6

      - name: Download llama.rn-0.13.0-rc.6 from Release
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          # Descarga el zip del asset del Release más reciente que lo contenga
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            --output llama.rn-0.13.0-rc.6.zip \
            "https://github.com/${{ github.repository }}/releases/download/llama-rn-0.13.0-rc.6/llama.rn-0.13.0-rc.6.zip"

          unzip -q llama.rn-0.13.0-rc.6.zip
          rm llama.rn-0.13.0-rc.6.zip
          echo "llama.rn listo en: $(pwd)/llama.rn-0.13.0-rc.6"

      # ── 8. CACHÉ DE node_modules ────────────────────────────────────────────
      - name: Cache node_modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: ChatterUI/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('ChatterUI/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      # ── 9. INSTALAR DEPENDENCIAS ────────────────────────────────────────────
      - name: Install npm dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: ChatterUI
        run: |
          npm ci \
            --prefer-offline \
            --no-audit \
            --no-fund \
            --ignore-scripts=false \
            --loglevel=error

      # ── 10. CACHÉ DE GRADLE ─────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ChatterUI/android/**/*.gradle*', 'ChatterUI/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 11. EXPO PREBUILD ───────────────────────────────────────────────────
      - name: Expo prebuild (Android)
        working-directory: ChatterUI
        run: |
          npx expo prebuild --platform android --clean --non-interactive
        env:
          APP_VARIANT: production

      # ── 12. LIBERAR RAM ANTES DE COMPILAR ──────────────────────────────────
      - name: Free RAM before native build
        run: |
          echo "=== RAM antes ==="
          free -h
          # Vaciar caches de página/dentries/inodes sin matar procesos
          sudo sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches > /dev/null
          echo "=== RAM después ==="
          free -h

      # ── 13. BUILD APK ───────────────────────────────────────────────────────
      - name: Build APK (release, sin firma)
        working-directory: ChatterUI/android
        run: |
          # Wrapper de ccache para el compilador NDK
          export CC="ccache clang"
          export CXX="ccache clang++"
          export CCACHE_CPP2=yes

          ./gradlew assembleRelease \
            --no-daemon \
            --no-build-cache \
            --parallel \
            --configure-on-demand \
            --stacktrace \
            -x lint \
            -x test \
            -x bundleReleaseJsAndAssets \
            -Pandroid.enableJetifier=false \
            -Pandroid.useAndroidX=true

      # ── 14. STATS DE CCACHE ─────────────────────────────────────────────────
      - name: ccache stats
        if: always()
        run: command -v ccache && ccache --show-stats || echo "ccache no disponible"

      # ── 15. SUBIR APK ───────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatterUI-${{ github.ref_name }}-${{ github.run_number }}
          path: ChatterUI/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
